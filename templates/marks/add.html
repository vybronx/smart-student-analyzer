{% extends "base.html" %}

{% block title %}Record Marks{% endblock %}
{% block header_title %}Enter Student Examination Marks{% endblock %}

{% block header_actions %}
<a href="{{ url_for('list_marks') }}" class="btn btn-sm btn-outline-secondary">
    <i class="fa-solid fa-arrow-left me-1"></i> Back to Ledger
</a>
{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto" style="max-width: 700px;">
    <div class="card-header bg-white py-3 border-0">
        <h6 class="fw-bold text-dark mb-0"><i class="fa-solid fa-pen-nib text-primary me-2"></i>Academic Marks Input Terminal</h6>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('add_mark') }}">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-semibold small">Select Student <span class="text-danger">*</span></label>
                    <select name="student_id" class="form-select" required>
                        <option value="">-- Choose Student --</option>
                        {% for st in students %}
                            <option value="{{ st.student_id }}" {% if selected_student_id == st.student_id|string %}selected{% endif %}>
                                {{ st.roll_no }} - {{ st.first_name }} {{ st.last_name }} ({{ st.course }} Sem {{ st.semester }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold small">Select Subject <span class="text-danger">*</span></label>
                    <select name="subject_id" class="form-select" required>
                        <option value="">-- Choose Subject --</option>
                        {% for sub in subjects %}
                            <option value="{{ sub.subject_id }}">
                                {{ sub.subject_code }} - {{ sub.subject_name }} ({{ sub.course }} Sem {{ sub.semester }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold small">Exam Type <span class="text-danger">*</span></label>
                    <select name="exam_type" class="form-select" required>
                        <option value="Semester Exam">Semester Exam</option>
                        <option value="Mid-Term Test">Mid-Term Test</option>
                        <option value="Internal Assessment">Internal Assessment</option>
                        <option value="Practical / Lab">Practical / Lab</option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold small">Marks Obtained <span class="text-danger">*</span></label>
                    <input type="number" step="0.5" name="marks_obtained" class="form-control" placeholder="e.g. 85.5" min="0" max="100" required>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold small">Max Marks <span class="text-danger">*</span></label>
                    <input type="number" step="0.5" name="max_marks" class="form-control" value="100.0" required>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                <a href="{{ url_for('list_marks') }}" class="btn btn-light border">Cancel</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-check me-1"></i> Save & Compute Grade
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
