{% extends "base.html" %}

{% block title %}Add Subject{% endblock %}
{% block header_title %}Create Curriculum Subject{% endblock %}

{% block header_actions %}
<a href="{{ url_for('list_subjects') }}" class="btn btn-sm btn-outline-secondary">
    <i class="fa-solid fa-arrow-left me-1"></i> Back to Subjects
</a>
{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto" style="max-width: 700px;">
    <div class="card-header bg-white py-3 border-0">
        <h6 class="fw-bold text-dark mb-0"><i class="fa-solid fa-book text-primary me-2"></i>Subject Details</h6>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('add_subject') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold small">Subject Code <span class="text-danger">*</span></label>
                    <input type="text" name="subject_code" class="form-control" placeholder="e.g. CS406" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small">Credits <span class="text-danger">*</span></label>
                    <input type="number" name="credits" class="form-control" value="3" min="1" max="10" required>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold small">Subject Name <span class="text-danger">*</span></label>
                    <input type="text" name="subject_name" class="form-control" placeholder="e.g. Artificial Intelligence & Machine Learning" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small">Course Stream <span class="text-danger">*</span></label>
                    <select name="course" class="form-select" required>
                        <option value="B.Tech (CS)">B.Tech (CS)</option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                        <option value="B.Sc (IT)">B.Sc (IT)</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small">Semester <span class="text-danger">*</span></label>
                    <select name="semester" class="form-select" required>
                        {% for s in range(1, 9) %}
                            <option value="{{ s }}">Semester {{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                <a href="{{ url_for('list_subjects') }}" class="btn btn-light border">Cancel</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-save me-1"></i> Save Subject
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
